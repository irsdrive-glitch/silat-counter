<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Penghitung Latihan Silat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;800&family=Barlow:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0c1424;--ink:#f2f6ff;--muted:#c3cee6;--lime:#d4ee3a;--lime-ink:#101a33;--orange:#ff7a3d;--teal:#2fc4b2;
    --glass:rgba(12,20,36,.38)}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overscroll-behavior:none;background:#000;color:var(--ink);font-family:Barlow,system-ui,sans-serif;overflow:hidden}

  /* Video memenuhi seluruh layar, tampil utuh (tidak terpotong) */
  .stage{position:fixed;top:0;left:0;width:100%;height:100vh;height:100dvh;background:#000}
  video,canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .stage.fit video,.stage.fit canvas{object-fit:contain}
  .stage.mirror video,.stage.mirror canvas{transform:scaleX(-1)}

  .count{position:absolute;top:env(safe-area-inset-top,0px);right:0;background:var(--lime);color:var(--lime-ink);
    font:800 clamp(56px,18vw,110px)/1 "Barlow Condensed",sans-serif;padding:6px 18px 2px;min-width:96px;text-align:center;font-style:italic}
  .msg{position:absolute;left:0;right:0;top:40%;text-align:center;padding:0 24px;font-size:18px;text-shadow:0 1px 6px #000}

  /* Statistik transparan di atas video */
  .hud{position:absolute;left:0;right:0;bottom:0;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));
    background:linear-gradient(to top,rgba(0,0,0,.55),rgba(0,0,0,0));display:grid;gap:10px}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px 8px;text-shadow:0 1px 5px #000}
  .stat small{display:block;color:var(--muted);font-size:12px}
  .stat b{font:800 26px/1.1 "Barlow Condensed",sans-serif}
  .stat b em{font:400 12px Barlow,sans-serif;color:var(--muted);font-style:normal}

  .bar{display:flex;gap:8px}
  button{padding:12px 18px;border:0;border-radius:8px;font:600 16px Barlow,sans-serif;cursor:pointer}
  button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
  #btnStart{background:var(--lime);color:var(--lime-ink);flex:1}
  #btnStart.on{background:var(--orange);color:#fff}
  #btnSave{background:var(--teal);color:#06231f}
  #btnMenu{background:var(--glass);color:var(--ink);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
  button[disabled]{opacity:.45;cursor:not-allowed}

  /* Pengaturan: tersembunyi, dibuka lewat tombol Atur */
  .settings{display:none;gap:10px;padding:12px;border-radius:10px;background:var(--glass);
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);max-height:45dvh;overflow:auto}
  .settings.open{display:grid}
  .row{display:flex;gap:8px;flex-wrap:wrap}
  label{font-size:14px;color:var(--muted);display:grid;gap:4px;flex:1;min-width:130px}
  input[type=text],input[type=number],select{width:100%;padding:10px;border-radius:8px;border:1px solid #2a3c61;background:rgba(12,20,36,.7);color:var(--ink);font-size:16px}
  .status{font-size:14px;color:var(--ink);min-height:1.2em;text-shadow:0 1px 5px #000}
  @media (min-width:700px){.hud{max-width:760px;margin:0 auto}}
  @media (prefers-reduced-motion:no-preference){.count.bump{animation:bump .18s}}
  @keyframes bump{50%{transform:scale(1.08)}}
</style>
</head>
<body>
<div class="stage" id="stage">
  <video id="video" playsinline muted></video>
  <canvas id="canvas"></canvas>
  <div class="count" id="count">0</div>
  <div class="msg" id="msg">Memuat model deteksi gerak…</div>

  <div class="hud">
    <div class="stats">
      <div class="stat"><small>Durasi</small><b id="time">00:00</b></div>
      <div class="stat"><small>Tempo per menit</small><b id="tempo">0</b></div>
      <div class="stat"><small>Jumlah</small><b id="count2">0</b></div>
      <div class="stat"><small>Kecepatan terakhir</small><b><span id="spLast">–</span> <em>km/j</em></b></div>
      <div class="stat"><small>Tercepat</small><b><span id="spMax">–</span> <em>km/j</em></b></div>
      <div class="stat"><small>Rata-rata</small><b><span id="spAvg">–</span> <em>km/j</em></b></div>
    </div>

    <div class="status" id="status"></div>

    <div class="settings" id="settings">
      <div class="row">
        <label>Jenis latihan
          <select id="jenis">
            <option value="depan">Tendangan depan</option>
            <option value="sabit">Tendangan sabit</option>
            <option value="t">Tendangan T</option>
            <option value="belakang">Tendangan belakang</option>
          </select>
        </label>
        <label>Tinggi badan (cm)
          <input type="number" id="tinggi" value="165" min="100" max="220" inputmode="numeric">
        </label>
      </div>
      <div class="row">
        <label>Nama pesilat<input type="text" id="nama" placeholder="Nama" autocomplete="off"></label>
        <label>Tinggi minimum tendangan: <b id="sensVal"></b>
          <input type="range" id="sens" min="-40" max="60" step="2" value="-8">
        </label>
      </div>
      <div class="row">
        <label>Kamera
          <select id="kamera">
            <option value="environment">Belakang</option>
            <option value="user">Depan (selfie)</option>
          </select>
        </label>
        <label>Tampilan video
          <select id="tampil">
            <option value="cover">Penuh layar</option>
            <option value="contain">Utuh (ada tepi hitam)</option>
          </select>
        </label>
      </div>
    </div>

    <div class="bar">
      <button id="btnMenu" aria-expanded="false" aria-controls="settings">Atur</button>
      <button id="btnStart" disabled>Mulai</button>
      <button id="btnSave" disabled>Simpan</button>
    </div>
  </div>
</div>

<script type="module">
import { PoseLandmarker, FilesetResolver, DrawingUtils } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/+esm";

// Isi dengan URL Web App dari Apps Script. Kosong = tidak kirim ke Sheets.
const SHEET_URL = "";

const TIPS = {
  depan:"Tendangan depan: HP di depan Anda, seluruh tubuh terlihat. Tekan Mulai.",
  sabit:"Tendangan sabit: HP di depan Anda, seluruh tubuh terlihat. Tekan Mulai.",
  t:"Tendangan T: HP di depan Anda, seluruh tubuh terlihat. Tekan Mulai.",
  belakang:"Tendangan belakang: letakkan HP di samping Anda (tampak samping). Tekan Mulai."
};
const NAMA_JENIS = { depan:"Tendangan depan", sabit:"Tendangan sabit", t:"Tendangan T", belakang:"Tendangan belakang" };

const $ = id => document.getElementById(id);
const video = $("video"), canvas = $("canvas"), ctx = canvas.getContext("2d");
let landmarker, running = false, count = 0, startAt = 0, kickTimes = [], speeds = [];
let lastVideoTime = -1, W = 1, H = 1, legRef = 0;
const mkLeg = (h,k,a) => ({ h, k, a, up:false, peak:0, hist:[], hit:0, last:0 });
let stream = null, lastKickAt = 0;
const LEGS = [mkLeg(23,25,27), mkLeg(24,26,28)];

const setStatus = t => { $("status").textContent = t; };
const dist = (p,q) => Math.hypot((p.x-q.x)*W, (p.y-q.y)*H);
function kneeAngle(h,k,a){
  const A = dist(h,k), B = dist(k,a), C = dist(h,a);
  const c = (A*A + B*B - C*C) / (2*A*B || 1);
  return Math.acos(Math.max(-1, Math.min(1, c))) * 180 / Math.PI;
}

async function startCamera(){
  if(stream) stream.getTracks().forEach(t => t.stop());
  const facing = $("kamera").value;
  stream = await navigator.mediaDevices.getUserMedia({ video:{ facingMode:{ ideal:facing }, width:{ideal:960}, height:{ideal:1280}, frameRate:{ideal:60} }, audio:false });
  video.srcObject = stream;
  await video.play();
  W = canvas.width = video.videoWidth; H = canvas.height = video.videoHeight;
  $("stage").classList.toggle("mirror", facing === "user");
  legRef = 0; lastVideoTime = -1;
  LEGS.forEach(l => { l.up = false; l.hist = []; l.hit = 0; });
}

// Ambang tinggi tendangan: cm di atas pinggul -> satuan panjang kaki
const sensCm = () => parseFloat($("sens").value);
const thrValue = () => sensCm() / (0.49 * (parseFloat($("tinggi").value) || 165));
function showSens(){
  const v = sensCm();
  $("sensVal").textContent = v === 0 ? "setinggi pinggul (0 cm)" : Math.abs(v) + " cm " + (v > 0 ? "di atas" : "di bawah") + " pinggul";
}

async function init(){
  try{
    const fileset = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
    landmarker = await PoseLandmarker.createFromOptions(fileset, {
      baseOptions:{ modelAssetPath:"https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task", delegate:"GPU" },
      runningMode:"VIDEO", numPoses:1
    });
    await startCamera();
    $("msg").textContent = TIPS[$("jenis").value];
    $("btnStart").disabled = false;
    loop();
  }catch(e){
    $("msg").textContent = "Kamera atau model gagal dimuat. Izinkan akses kamera dan buka lewat https.";
    setStatus(String(e.message || e));
  }
}

// Apakah kaki sedang melakukan tendangan jenis yang dipilih?
function isKick(type, leg, lm, thr){
  const hip = lm[leg.h], knee = lm[leg.k], ank = lm[leg.a];
  const dx = (ank.x - hip.x) * W / legRef;
  const dy = (hip.y - ank.y) * H / legRef;   // positif = di atas pinggul
  const ang = kneeAngle(hip, knee, ank);
  switch(type){
    case "depan": return dy > thr && Math.abs(dx) < 0.6 && ang > 140;
    case "t":     return dy > thr - 0.3 && Math.abs(dx) > 0.7 && ang > 140;
    case "sabit": return dy > thr && Math.abs(dx) > 0.4 && ang <= 150;
    case "belakang": {
      const facing = Math.sign(lm[0].x - (lm[23].x + lm[24].x) / 2) || 1;
      return dy > thr - 0.3 && (-dx * facing) > 0.5;
    }
  }
  return false;
}

function ankleSpeed(leg, ank, now){
  leg.hist.push({ t:now, x:ank.x*W, y:ank.y*H });
  while(leg.hist.length > 1 && now - leg.hist[1].t >= 90) leg.hist.shift();
  const o = leg.hist[0];
  if(now - o.t < 50) return 0;
  const px = Math.hypot(ank.x*W - o.x, ank.y*H - o.y);
  const mPerPx = 0.49 * (parseFloat($("tinggi").value) / 100 || 1.65) / legRef; // jarak pinggul–pergelangan ≈ 0,49 × tinggi badan
  return Math.min(200, px * mPerPx / ((now - o.t) / 1000) * 3.6);
}

function registerKick(){
  count++; kickTimes.push(performance.now());
  $("count").textContent = $("count2").textContent = count;
  const c = $("count"); c.classList.remove("bump"); void c.offsetWidth; c.classList.add("bump");
}

function showSpeeds(){
  if(!speeds.length) return;
  $("spLast").textContent = Math.round(speeds[speeds.length-1]);
  $("spMax").textContent = Math.round(Math.max(...speeds));
  $("spAvg").textContent = Math.round(speeds.reduce((a,b)=>a+b,0) / speeds.length);
}

function loop(){
  if(video.currentTime !== lastVideoTime && video.readyState >= 2){
    lastVideoTime = video.currentTime;
    const now = performance.now();
    const res = landmarker.detectForVideo(video, now);
    ctx.clearRect(0,0,W,H);
    const lm = res.landmarks && res.landmarks[0];
    if(lm){
      const du = new DrawingUtils(ctx);
      du.drawConnectors(lm, PoseLandmarker.POSE_CONNECTIONS, { color:"#2fc4b2", lineWidth:4 });
      du.drawLandmarks(lm, { color:"#ff7a3d", radius:3 });
      const need = [23,24,25,26,27,28,0];
      const ok = need.every(i => (lm[i].visibility ?? 1) > 0.5);
      if(ok){
        if(!LEGS.some(l => l.up)){   // ukur panjang kaki saat berdiri biasa
          const cur = (dist(lm[23],lm[25]) + dist(lm[25],lm[27]) + dist(lm[24],lm[26]) + dist(lm[26],lm[28])) / 2;
          legRef = legRef ? legRef*0.9 + cur*0.1 : cur;
        }
        if(running && legRef){
          const type = $("jenis").value, thr = thrValue();
          for(const leg of LEGS){
            const sp = ankleSpeed(leg, lm[leg.a], now);
            if(!leg.up){
              // harus terdeteksi 2 frame berturut-turut, ada jeda antar tendangan
              leg.hit = isKick(type, leg, lm, thr) ? leg.hit + 1 : 0;
              if(leg.hit >= 2 && now - leg.last > 300 && now - lastKickAt > 250){
                leg.up = true; leg.peak = 0; leg.hit = 0; leg.last = lastKickAt = now; registerKick();
              }
            }else{
              leg.peak = Math.max(leg.peak, sp);
              // tendangan dianggap selesai hanya jika kaki turun jauh di bawah ambang (histeresis)
              if(!isKick(type, leg, lm, thr - 0.25)){
                leg.up = false;
                if(leg.peak > 0){ speeds.push(leg.peak); showSpeeds(); }
              }
            }
          }
        }
      }
    }
  }
  if(running){
    const s = Math.floor((performance.now() - startAt) / 1000);
    $("time").textContent = String(Math.floor(s/60)).padStart(2,"0") + ":" + String(s%60).padStart(2,"0");
    const t = performance.now();
    kickTimes = kickTimes.filter(k => t - k < 10000);
    $("tempo").textContent = Math.round(kickTimes.length * 6);
  }
  requestAnimationFrame(loop);
}

$("sens").oninput = $("tinggi").oninput = showSens; showSens();
$("tampil").onchange = () => $("stage").classList.toggle("fit", $("tampil").value === "contain");
$("kamera").onchange = async () => {
  if(running) return;
  try{ await startCamera(); }catch(e){ setStatus("Kamera gagal dibuka: " + (e.message || e)); }
};
$("jenis").onchange = () => { if(!running) $("msg").textContent = TIPS[$("jenis").value]; };

$("btnMenu").onclick = () => {
  const open = $("settings").classList.toggle("open");
  $("btnMenu").setAttribute("aria-expanded", open);
  $("btnMenu").textContent = open ? "Tutup" : "Atur";
};

$("btnStart").onclick = () => {
  running = !running;
  const b = $("btnStart");
  if(running){
    count = 0; kickTimes = []; speeds = []; LEGS.forEach(l => { l.up = false; l.hist = []; l.hit = 0; l.last = 0; }); lastKickAt = 0;
    startAt = performance.now();
    $("count").textContent = $("count2").textContent = 0;
    ["spLast","spMax","spAvg"].forEach(id => $(id).textContent = "–");
    $("msg").textContent = ""; b.textContent = "Selesai"; b.classList.add("on");
    $("btnSave").disabled = true; $("jenis").disabled = $("kamera").disabled = true; setStatus("");
    $("settings").classList.remove("open"); $("btnMenu").textContent = "Atur"; $("btnMenu").setAttribute("aria-expanded", false);
  }else{
    b.textContent = "Mulai lagi"; b.classList.remove("on");
    $("btnSave").disabled = false; $("jenis").disabled = $("kamera").disabled = false;
  }
};

$("btnSave").onclick = async () => {
  const nama = $("nama").value.trim();
  if(!nama){ setStatus("Isi nama pesilat dulu (tombol Atur)."); return; }
  if(!SHEET_URL){ setStatus("URL Apps Script belum diisi di file index.html."); return; }
  const data = {
    nama, tanggal:new Date().toISOString(), jenis:NAMA_JENIS[$("jenis").value], durasi:$("time").textContent,
    jumlah:count, tempo:+$("tempo").textContent,
    tercepat:speeds.length ? Math.round(Math.max(...speeds)) : 0,
    rataRata:speeds.length ? Math.round(speeds.reduce((a,b)=>a+b,0)/speeds.length) : 0
  };
  try{
    await fetch(SHEET_URL, { method:"POST", mode:"no-cors", headers:{ "Content-Type":"text/plain;charset=utf-8" }, body:JSON.stringify(data) });
    setStatus("Hasil dikirim ke Google Sheets.");
    $("btnSave").disabled = true;
  }catch(e){ setStatus("Gagal mengirim: " + e.message); }
};

init();
</script>
</body>
</html>
